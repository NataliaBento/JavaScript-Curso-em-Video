<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imigração</title>
</head>
<body>
   <h1>Detector de Estrangeiro</h1> 
   <input type="text" name="nacionalidade" id="nacionalidade">
   <input type="button" value="verificar" onclick="verifica()">
   <div id="res"></div>

   <script>

    function verifica(){

        var txt = document.querySelector('input#nacionalidade')
        var res = document.querySelector('div#res')
        res.innerHTML = `Você veio do país${txt.value}`
        if (txt.value != 'Brasil'){

            res.innerHTML += 'Você é estrangeiro!'
        }
        else {
            res.innerHTML += 'Você é Brasileiro!'
        }
    }


   </script>
</body>
</html>
